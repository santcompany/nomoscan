<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomoscan — A Lara no WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9;--ink:#0a0a0a;--ink-soft:#3a3a3a;--ink-muted:#757575;--ink-faded:#bdbdbd;
  --border:#e4e3df;--border-strong:#c8c6c0;
  --wa-header:#075e54;--wa-bg:#efe7dd;--wa-out:#d9fdd3;--wa-in:#ffffff;--wa-green:#25d366;
  --positive:#1f6b3a;--amber:#b97e0a;--urgent:#c0392b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',system-ui,sans-serif;background:transparent;color:var(--ink);
  margin:0;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
.stage{width:100%;aspect-ratio:16/9;background:var(--bg);position:relative;display:flex;overflow:hidden;}
.walist{width:32%;max-width:290px;flex-shrink:0;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;}
.walist__top{background:var(--wa-header);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;}
.walist__top svg{width:17px;height:17px;}
.walist__items{flex:1;overflow:hidden;}
.waitem{padding:11px 14px;border-bottom:1px solid #f1f0ed;display:flex;gap:10px;align-items:center;transition:background .3s;}
.waitem.active{background:#f1f0ed;}
.waitem__av{width:36px;height:36px;border-radius:999px;background:var(--wa-header);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.waitem__av.lara{background:var(--ink);}
.waitem__av.urgent{background:var(--urgent);}
.waitem__body{min-width:0;flex:1;}
.waitem__nm{font-size:12.5px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.waitem__nm time{font-size:9px;color:var(--ink-faded);font-weight:400;flex-shrink:0;}
.waitem__pv{font-size:11px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;transition:color .3s;}
.waitem__pv.green{color:var(--wa-green);}
.waitem__pv.amber{color:var(--amber);}
.waitem__pv.urgent{color:var(--urgent);font-weight:500;}
.waitem__pv .tick{color:#53bdeb;font-weight:700;}
.thread{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--wa-bg);
  background-image:radial-gradient(circle at 18% 18%, rgba(0,0,0,.015) 0, transparent 42%);}
.thread__head{background:var(--wa-header);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:11px;transition:background .35s;}
.thread__head.urgent{background:#0e6b5c;}
.thread__av{width:33px;height:33px;border-radius:999px;background:#ffffff22;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.thread__who b{font-size:13px;display:block;}
.thread__who span{font-size:10px;opacity:.85;}
.thread__body{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:9px;justify-content:flex-end;overflow:hidden;}
.bub{max-width:76%;padding:9px 13px;border-radius:10px;font-size:12.5px;line-height:1.42;position:relative;
  opacity:0;transform:translateY(9px);transition:opacity .35s ease,transform .35s ease;box-shadow:0 1px 1.5px rgba(0,0,0,.08);}
.bub.show{opacity:1;transform:none;}
.bub.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px;}
.bub.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px;}
.bub time{display:block;font-size:9px;color:#00000055;text-align:right;margin-top:2px;}
.bub .lara-tag{font-size:8.5px;color:var(--positive);font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:4px;}
.bub .lara-tag::before{content:'';width:5px;height:5px;border-radius:99px;background:var(--wa-green);}
.sys{align-self:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 13px;font-size:11px;
  display:flex;align-items:center;gap:8px;opacity:0;transform:scale(.92);transition:all .35s cubic-bezier(.34,1.4,.5,1);max-width:88%;box-shadow:0 6px 20px -8px rgba(0,0,0,.4);}
.sys.show{opacity:1;transform:none;}
.sys svg{width:14px;height:14px;flex-shrink:0;}
.sys.agenda svg{stroke:var(--wa-green);}
.sys.bell svg{stroke:#f6c344;}
.sys.urgent{background:var(--urgent);}
.sys.urgent svg{stroke:#fff;}
.typing{align-self:flex-start;background:var(--wa-in);border-radius:10px;border-top-left-radius:2px;
  padding:10px 13px;display:flex;gap:4px;opacity:0;transition:opacity .2s;box-shadow:0 1px 1.5px rgba(0,0,0,.08);}
.typing.show{opacity:1;}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--ink-faded);animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.caption{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;
  transition:all .35s;white-space:nowrap;font-weight:500;z-index:30;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);}
.caption.show{opacity:1;transform:translateX(-50%) translateY(0);}
.caption.urgent{background:var(--urgent);}
.caption.amber{background:var(--amber);}
.scene-chip{position:absolute;top:15px;right:17px;background:#ffffffee;border:1px solid var(--border);
  border-radius:999px;padding:5px 12px;font-size:10px;color:var(--ink-soft);font-family:'Geist Mono',monospace;
  z-index:30;transition:opacity .3s;letter-spacing:.03em;}
.progress{position:absolute;top:0;left:0;height:3px;background:var(--wa-green);width:0;z-index:40;transition:width .3s linear;}
.outro{position:absolute;inset:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .5s;z-index:50;padding:40px;text-align:center;}
.outro.show{opacity:1;}
.outro__title{font-family:'Instrument Serif',serif;font-size:38px;line-height:1.1;}
.outro__sub{font-size:15px;color:#bdbdbd;max-width:440px;line-height:1.5;}
.outro__chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.outro__chip{font-size:11px;border:1px solid #ffffff33;border-radius:999px;padding:5px 12px;color:#e0e0e0;}

@media (max-width:560px){
  .walist{display:none;}
  .thread__body{padding:14px 14px 20px;gap:8px;}
  .bub{max-width:88%;font-size:14px;}
  .thread__head{padding:10px 14px;}
  .caption{font-size:13px;padding:8px 14px;bottom:14px;}
  .scene-chip{font-size:9px;padding:4px 9px;top:10px;right:10px;}
  .outro__title{font-size:28px;}
  .outro__sub{font-size:13px;}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="progress" id="progress"></div>
  <aside class="walist">
    <div class="walist__top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Tessaro Advogados
    </div>
    <div class="walist__items" id="listItems"></div>
  </aside>
  <main class="thread">
    <div class="thread__head" id="threadHead">
      <div class="thread__av" id="threadAv">?</div>
      <div class="thread__who"><b id="threadName">—</b><span id="threadStatus">online</span></div>
    </div>
    <div class="thread__body" id="threadBody"></div>
  </main>
  <div class="scene-chip" id="sceneChip">no WhatsApp do escritório</div>
  <div class="caption" id="caption"></div>
  <div class="outro" id="outro">
    <div class="outro__title">A Lara não é da escala 6x1.<br>Nem 5x2.</div>
    <div class="outro__sub">Ela foi criada para a escala <b style="color:#fff;">24/7</b> — atende, organiza, protege e antecipa. Todos os dias, a qualquer hora, sem férias e sem folga.</div>
    <div class="outro__chips">
      <span class="outro__chip">Capta leads</span><span class="outro__chip">Agenda</span>
      <span class="outro__chip">Responde</span><span class="outro__chip">Escala urgências</span>
      <span class="outro__chip">Avisa você</span><span class="outro__chip">Antecipa</span>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const listItems=$('#listItems'),threadBody=$('#threadBody'),caption=$('#caption');
const threadAv=$('#threadAv'),threadName=$('#threadName'),threadStatus=$('#threadStatus');
const threadHead=$('#threadHead'),sceneChip=$('#sceneChip'),progress=$('#progress'),outro=$('#outro');
let timers=[],playing=true;
function at(ms,fn){timers.push(setTimeout(fn,ms));}
const convs=[
  {av:'BM',nm:'Bruno Martins',pv:'Vi o anúncio de vocês',t:'agora',cls:''},
  {av:'MA',nm:'Maria Aparecida',pv:'Quero marcar reunião',t:'14:02',cls:''},
  {av:'LP',nm:'Lúcia Pereira',pv:'Lara: respondido',t:'13:51',cls:'green'},
  {av:'RF',nm:'Roberto Ferreira',pv:'Lara: andamento enviado',t:'13:40',cls:'green'},
  {av:'EC',nm:'Edson Costa',pv:'Lara: lembrete enviado',t:'13:22',cls:'amber'},
  {av:'!',nm:'Carlos Nunes',pv:'É URGENTE, meu filho',t:'13:10',cls:'urgent',avcls:'urgent'},
  {av:'GT',nm:'Dr. Guilherme',pv:'Lara, avisa a Dona Ana…',t:'12:58',lara:true},
  {av:'AS',nm:'Antônio Souza',pv:'Lara: reagendado',t:'12:30',cls:'green'}
];
function renderList(hl){
  listItems.innerHTML=convs.map(c=>`
    <div class="waitem ${c.nm===hl?'active':''}">
      <div class="waitem__av ${c.lara?'lara':''} ${c.avcls||''}">${c.av}</div>
      <div class="waitem__body">
        <div class="waitem__nm">${c.nm}<time>${c.t}</time></div>
        <div class="waitem__pv ${c.cls||''}">${c.tick?'<span class="tick">✓✓</span> ':''}${c.pv}</div>
      </div>
    </div>`).join('');
}
function preview(nm,pv,cls){const c=convs.find(x=>x.nm===nm);if(c){c.pv=pv;c.cls=cls||'';}}
function head(name,av,status,headCls){threadName.textContent=name;threadAv.textContent=av;threadStatus.textContent=status;
  threadHead.className='thread__head'+(headCls?' '+headCls:'');}
function clearT(){threadBody.innerHTML='';}
function typing(d,dur){at(d,()=>{const t=document.createElement('div');t.className='typing';t.id='typing';t.innerHTML='<i></i><i></i><i></i>';threadBody.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));});
  at(d+dur,()=>{const t=$('#typing');if(t)t.remove();});}
function bub(side,html,a,b,c){
  // Chamada do cliente: bub('in', html, delay)  -> a = delay (número grande), sem time, sem lara
  // Chamada da Lara:    bub('out', html, time, delay, lara)
  let time='', d, lara=false;
  if(b===undefined && c===undefined){ d=a; }            // 3 args: a é o delay
  else { time=a; d=b; lara=c; }                          // 5 args: time, delay, lara
  at(d,()=>{const el=document.createElement('div');el.className='bub '+side;
    el.innerHTML=(lara?'<div class="lara-tag">Lara · assistente virtual</div>':'')+html+(time?'<time>'+time+'</time>':'');
    threadBody.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));});
}
function sys(cls,html,d){at(d,()=>{const s=document.createElement('div');s.className='sys '+cls;s.innerHTML=html;
  threadBody.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')));});}
function cap(txt,d,cls){at(d,()=>{caption.textContent=txt;caption.className='caption show'+(cls?' '+cls:'');});}
function capHide(d){at(d,()=>caption.classList.remove('show'));}
function chip(txt,d){at(d,()=>sceneChip.textContent=txt);}
function prog(pct,d){at(d,()=>progress.style.width=pct+'%');}
const CAL='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const ALERT='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
const D=7200;
function play(){
  timers.forEach(clearTimeout);timers=[];playing=true;
  preview('Bruno Martins','Vi o anúncio de vocês','');preview('Maria Aparecida','Quero marcar reunião','');
  preview('Carlos Nunes','É URGENTE, meu filho','urgent');preview('Dr. Guilherme','Lara, avisa a Dona Ana…','');
  outro.classList.remove('show');progress.style.width='0';
  let t=0;
  // 01 LEAD
  at(t,()=>{renderList('Bruno Martins');clearT();head('Bruno Martins','BM','online');chip('Lara → lead novo');});
  cap('Um lead novo chega — ela capta sozinha',t+400,'');
  bub('in','Oi, vi o anúncio de vocês. Cuidam de caso de rescisão trabalhista?',t+900);
  typing(t+2400,1500);
  bub('out','Oi! Sou a Lara, assistente virtual do Tessaro Advogados. 😊 Cuidamos sim! Me conta seu nome e o que aconteceu, que já encaminho pro time.','14:21',t+4100,true);
  bub('in','Sou o Bruno. Fui demitido sem receber as verbas.',t+5400);
  at(t+6200,()=>preview('Bruno Martins','Lara: lead qualificado','green'));
  prog(10,t+D-200);t+=D;
  // 02 AGENDA
  at(t,()=>{renderList('Maria Aparecida');clearT();head('Maria Aparecida','MA','online');chip('Lara → agendamento');});
  cap('Marca reunião e organiza a agenda',t+400,'');
  bub('in','Quero marcar uma reunião com o advogado.',t+900);
  typing(t+2200,1200);
  bub('out','Claro! Sobre qual assunto seria?','14:02',t+3700,true);
  bub('in','Revisão de um contrato de locação.',t+5000);
  sys('agenda',CAL+' Google Agenda · qui 05/06, 15h',t+6100);
  prog(20,t+D-200);t+=D;
  // 03 DÚVIDA
  at(t,()=>{renderList('Lúcia Pereira');clearT();head('Lúcia Pereira','LP','online');chip('Lara → dúvida do cliente');});
  cap('Responde dúvidas na hora',t+400,'');
  bub('in','Dra., o que eu preciso levar na audiência amanhã?',t+900);
  typing(t+2400,1500);
  bub('out','Oi, Dona Lúcia! Leve um documento com foto (RG ou CNH), o CPF e a carteira de trabalho. Chegue uns 20 min antes. Qualquer coisa, estou aqui! 🙂','13:51',t+4100,true);
  prog(30,t+D-200);t+=D;
  // 04 ANDAMENTO
  at(t,()=>{renderList('Roberto Ferreira');clearT();head('Roberto Ferreira','RF','online');chip('Lara → andamento');});
  cap('Explica o andamento do processo',t+400,'');
  bub('in','Como está meu processo?',t+900);
  typing(t+2200,1500);
  bub('out','Localizei aqui, Sr. Roberto! Está em fase de instrução — a audiência já foi designada e aguardamos a data. Assim que houver novidade, te aviso. 👍','13:40',t+4100,true);
  prog(40,t+D-200);t+=D;
  // 05 HONORÁRIO
  at(t,()=>{renderList('Edson Costa');clearT();head('Edson Costa','EC','online');chip('Lara → financeiro');});
  cap('Lembra de honorários com educação',t+400,'amber');
  typing(t+900,1300);
  bub('out','Bom dia, Sr. Edson! 😊 Passando pra lembrar, com carinho, que a parcela dos honorários (R$ 850) vence amanhã, 02/06. Posso te enviar o PIX ou o boleto?','13:22',t+2500,true);
  bub('in','Pode mandar o PIX, por favor.',t+4800);
  at(t+5100,()=>preview('Edson Costa','Lara: lembrete enviado','amber'));
  prog(50,t+D-200);t+=D;
  // 06 URGÊNCIA
  at(t,()=>{renderList('Carlos Nunes');clearT();head('Carlos Nunes','!','online','urgent');chip('Lara → triagem de urgência');});
  cap('Identifica o que é urgente — e age',t+400,'urgent');
  bub('in','SOCORRO! Meu filho foi preso em flagrante agora, preciso de um advogado JÁ!',t+900);
  typing(t+2600,1300);
  bub('out','Sr. Carlos, fique calmo — já estou acionando o Dr. Guilherme neste momento. Me diga a delegacia onde ele está.','13:10',t+4300,true);
  sys('urgent',ALERT+' Caso urgente escalado ao Dr. Guilherme · agora',t+5600);
  prog(60,t+D-200);t+=D;
  // 07 ORDEM DO ADVOGADO
  at(t,()=>{renderList('Dr. Guilherme');clearT();head('Dr. Guilherme','GT','você','');chip('advogado → Lara');});
  cap('Recebe ordens suas e executa',t+400,'');
  bub('in','Lara, avisa a Dona Ana que a petição dela foi protocolada hoje.',t+900);
  typing(t+2600,1300);
  bub('out','Pode deixar, Dr.! Já aviso a Dona Ana agora mesmo. ✅','12:45',t+4300,true);
  sys('bell',BELL+' Mensagem enviada para Ana Paula',t+5600);
  prog(70,t+D-200);t+=D;
  // 08 REMARCA
  at(t,()=>{renderList('Antônio Souza');clearT();head('Antônio Souza','AS','online');chip('Lara → remarcação');});
  cap('Remarca quando você pede',t+400,'');
  bub('out','Sr. Antônio, o Dr. precisou ajustar a agenda. Podemos passar sua reunião de quarta para sexta, 06/06, às 10h?','12:30',t+900,true);
  bub('in','Por mim tudo bem!',t+3400);
  sys('agenda',CAL+' Google Agenda atualizado · sex 06/06, 10h',t+4600);
  prog(80,t+D-200);t+=D;
  // 09 AVISA O DR
  at(t,()=>{renderList('Dr. Guilherme');clearT();head('Dr. Guilherme','GT','você','');chip('Lara → advogado');});
  cap('E te mantém informado de tudo',t+400,'');
  typing(t+900,1300);
  bub('out','Dr., resumo de hoje: 1 lead novo qualificado, 2 reuniões alocadas na agenda e 1 caso urgente escalado. Está tudo na palma da sua mão. 📋','13:30',t+2500,true);
  bub('in','Excelente, Lara!',t+4800);
  prog(90,t+D-200);t+=D;
  // 10 PROATIVA
  at(t,()=>{renderList('Roberto Ferreira');clearT();head('Roberto Ferreira','RF','online');chip('Lara → cliente (proativa)');});
  cap('E antecipa: procura o cliente sozinha',t+400,'');
  typing(t+900,1400);
  bub('out','Sr. Roberto, novidade no seu processo! 😊 Foi designada a audiência para 18/06 às 9h30, na Vara do Trabalho de Aquidauana. O Dr. vai te orientar antes. Qualquer dúvida, é só chamar!','13:55',t+2600,true);
  bub('in','Que ótimo, muito obrigado!',t+5000);
  prog(100,t+D-200);t+=D;
  // FECHO
  capHide(t);
  at(t+300,()=>outro.classList.add('show'));
  at(t+4200,()=>{if(playing)play();});
}
function arrancar(){try{play();}catch(e){console.error(e);}}
if(document.readyState==='complete')arrancar();
else window.addEventListener('load',arrancar);
</script>
</body>
</html>
